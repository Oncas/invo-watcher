[project]
name = "invo-agent"
version = "0.1.0"
description = "Local Involio copy-trade agent (notifications → mimic)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "hyperliquid-python-sdk>=0.24.0",
  "eth-account>=0.13.0",
  "cryptography>=44.0.0",
  "base58>=2.1.1",
  "turnkey-api-key-stamper>=0.1.0",
  "turnkey-http>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
  "pytest>=8.3.0",
]

[project.scripts]
invo-agent = "invo_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invo_agent"]

# Map src/ layout → import name invo_agent
[tool.hatch.build.targets.wheel.sources]
"src/invo_agent" = "invo_agent"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
