name: Deploy VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" ]]; then
            echo "Set repo secret VPS_HOST (VPS public IP or hostname)" >&2
            exit 1
          fi
          if [[ -z "${VPS_SSH_KEY:-}" ]]; then
            echo "Set repo secret VPS_SSH_KEY (private key for the invo user)" >&2
            exit 1
          fi
          user="${VPS_USER:-invo}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${user}@${VPS_HOST}" \
            '/opt/invo-agent/scripts/vps-deploy.sh'
